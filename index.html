<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Notti lontane</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Special+Elite&display=swap');

  :root{
    --night-1:#05060B;
    --night-2:#0E1020;
    --night-3:#161832;
    --card-line:#3E4473;
    --ink:#F8F4EA;
    --ink-dim:#8A85A5;
    --amber:#FFB042;
    --amber-glow:rgba(255, 176, 66, 0.5);
    --amber-soft:rgba(255, 176, 66, 0.12);
    --amber-ink:#1A1205;
    --wood-dark:#180B07;
    --wood-light:#3A2016;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 50% 0%, rgba(255, 176, 66, 0.15), transparent 50%),
      radial-gradient(ellipse at 80% 90%, rgba(22, 24, 50, 0.8), transparent 60%),
      linear-gradient(180deg, var(--night-1), var(--night-2) 60%, var(--night-1));
    color:var(--ink);
    font-family:'Special Elite', 'Courier New', monospace;
    display:flex;
    justify-content:center;
    padding:20px 12px 60px;
    position:relative;
  }
  body::before{
    content:"";
    position:fixed;inset:0;
    pointer-events:none;
    background-image:radial-gradient(circle at 1px 1px, rgba(243,237,223,0.03) 1px, transparent 0);
    background-size:6px 6px;
  }

  /* WELCOME SCREEN */
  .welcome-screen {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at center, var(--night-2), var(--night-1));
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    text-align: center;
    transition: opacity 0.8s ease, visibility 0.8s ease;
  }
  .welcome-screen.hidden {
    opacity: 0;
    visibility: hidden;
  }
  .welcome-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 58px;
    color: var(--amber);
    margin: 0 0 10px;
    letter-spacing: 0.08em;
    text-shadow: 0 0 25px var(--amber-glow);
  }
  .welcome-sub {
    font-size: 15px;
    color: var(--ink-dim);
    font-style: italic;
    margin-bottom: 30px;
  }
  .enter-btn {
    padding: 16px 36px;
    border-radius: 999px;
    border: 2px solid var(--amber);
    background: linear-gradient(135deg, #FFC064, var(--amber));
    color: var(--amber-ink);
    font-family: 'Special Elite', monospace;
    font-size: 13px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 6px 25px var(--amber-glow);
  }

  .wrap{width:100%;max-width:500px;position:relative;}

  /* HEADER */
  header{text-align:center;margin-bottom:20px;position:relative;}
  .eyebrow{
    font-size:11px;
    letter-spacing:0.35em;
    text-transform:uppercase;
    color:var(--amber);
    margin-bottom:6px;
    text-shadow: 0 0 10px var(--amber-glow);
  }
  h1{
    font-family:'Bebas Neue', sans-serif;
    font-size:52px;
    font-weight:400;
    letter-spacing:0.08em;
    margin:0 0 2px;
    line-height:1;
    color: var(--ink);
  }
  .subtitle{
    color:var(--ink-dim);
    font-size:13px;
    font-style:italic;
    margin:0;
  }
  .edit-toggle{
    position:absolute;
    top:0; right:0;
    background:rgba(255,255,255,0.03);
    border:1px solid var(--card-line);
    color:var(--ink-dim);
    width:36px;height:36px;
    border-radius:50%;
    cursor:pointer;
    font-size:14px;
    display:flex;
    align-items:center;justify-content:center;
  }
  .edit-toggle.active{border-color:var(--amber);color:var(--amber);background:var(--amber-soft);}

  /* TUNER */
  .tuner{margin:16px 0 24px;}
  .tuner-line{
    background:var(--night-1);
    border:1px solid var(--card-line);
    border-radius:8px;
    padding:8px 10px;
    box-shadow:inset 0 3px 8px rgba(0,0,0,0.6);
  }
  .tuner-ticks{display:flex;justify-content:space-between;gap:4px;}
  .tick{
    flex:1;
    height:8px;
    border-radius:2px;
    background:rgba(138, 133, 165, 0.15);
  }
  .tick.past{background:rgba(138, 133, 165, 0.4);}
  .tick.today{background:var(--amber);box-shadow:0 0 8px var(--amber-glow);}
  .tuner-label{
    text-align:center;
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--ink-dim);
    margin-top:8px;
  }
  .tuner-label b{color:var(--amber);font-weight:normal;}

  /* ---------------------------------------------------- */
  /* RASTRELLIERA RACK VINTAGE CON VINILI SPUNTANTI       */
  /* ---------------------------------------------------- */
  .rack-container {
    background: linear-gradient(180deg, var(--wood-dark) 0%, #0A0503 100%);
    border: 3px solid #2d1810;
    border-radius: 16px;
    padding: 20px 14px;
    box-shadow: 
      inset 0 0 25px rgba(0,0,0,0.95),
      0 12px 30px rgba(0,0,0,0.7);
    position: relative;
  }

  .rack-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px 12px;
  }

  /* BUSTA DI VINILE */
  .album-slot {
    position: relative;
    height: 125px;
    cursor: pointer;
    overflow: visible;
  }

  /* IL DISCO CHE SPUNTA DA DIETRO */
  .album-disc {
    position: absolute;
    top: 6px;
    right: 4px;
    width: 95px;
    height: 95px;
    border-radius: 50%;
    background: 
      radial-gradient(circle at 50% 50%, #222 0%, #111 60%, #000 100%),
      repeating-radial-gradient(circle, rgba(255,255,255,0.05) 0px, transparent 2px, rgba(255,255,255,0.05) 4px);
    border: 1px solid #333;
    box-shadow: 3px 3px 10px rgba(0,0,0,0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
    transform: translateX(18px) rotate(15deg);
    transition: transform 0.3s ease;
  }

  .album-disc-label {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #252840;
    border: 2px solid #111;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 15px;
    color: var(--ink-dim);
  }

  .album-sleeve {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 82%;
    height: 105px;
    background: linear-gradient(145deg, #1A1D36, #0E1022);
    border: 1px solid var(--card-line);
    border-radius: 8px;
    padding: 10px;
    box-shadow: -3px 4px 10px rgba(0,0,0,0.6);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    z-index: 2;
    transition: all 0.25s ease;
  }

  .sleeve-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 32px;
    line-height: 1;
    color: var(--ink-dim);
  }
  .sleeve-tag {
    font-size: 9px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }

  /* INTERAZIONI HOVER E STATI */
  .album-slot:hover .album-disc {
    transform: translateX(28px) rotate(40deg);
  }
  .album-slot:hover .album-sleeve {
    border-color: var(--amber);
  }

  /* STATO BLOCCATO */
  .album-slot.locked {
    opacity: 0.45;
  }
  .album-slot.locked .album-disc {
    transform: translateX(6px); /* Spunta solo un pochino */
  }

  /* STATO OGGI / SBLOCCATO */
  .album-slot.today-active .album-sleeve {
    border: 2px solid var(--amber);
    background: linear-gradient(145deg, #2D2115, #121428);
    box-shadow: 0 0 15px var(--amber-glow);
  }
  .album-slot.today-active .sleeve-num {
    color: var(--amber);
    text-shadow: 0 0 8px var(--amber-glow);
  }
  .album-slot.today-active .sleeve-tag {
    color: var(--amber);
    font-weight: bold;
  }
  .album-slot.today-active .album-disc-label {
    background: linear-gradient(135deg, #FFC064, var(--amber));
    color: var(--amber-ink);
  }

  /* MODAL MODELLO GIRADISCHI */
  .overlay{
    position:fixed;inset:0;
    background:rgba(4,5,10,0.88);
    backdrop-filter:blur(8px);
    display:none;
    align-items:center;justify-content:center;
    padding:20px;
    z-index:50;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .overlay.show{ display:flex; opacity: 1; }

  .modal{
    background: linear-gradient(160deg, var(--night-3), #101222);
    border:1px solid rgba(255,255,255,0.12);
    box-shadow:0 25px 50px rgba(0,0,0,0.9);
    border-radius:20px;
    padding:24px 20px;
    width:100%;max-width:380px;
    position:relative;
  }
  
  .modal .close{
    position:absolute;top:14px;right:14px;
    background:rgba(255,255,255,0.06);
    border:none;color:var(--ink-dim);
    width: 30px; height: 30px; border-radius: 50%;
    cursor:pointer;
  }
  .modal h2{
    font-family:'Bebas Neue', sans-serif;
    margin:0 0 2px;font-size:32px;color:var(--amber);
  }
  .modal .artist{color:var(--ink-dim);font-style:italic;font-size:13px;margin:0 0 12px;}
  .modal .message{
    font-size:13px;line-height:1.6;
    color:var(--ink);
    margin:0 0 16px;
    border-top:1px dashed var(--card-line);
    border-bottom:1px dashed var(--card-line);
    padding:12px 0;
  }
  
  /* PLAYER GIRADISCHI */
  .turntable {
    position: relative;
    width: 230px;
    height: 150px;
    margin: 5px auto 18px;
    background: linear-gradient(135deg, #381E15, #1A0C07);
    border-radius: 12px;
    border: 3px solid #100604;
    box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
    display: flex;
    align-items: center;
    padding-left: 14px;
    overflow: hidden;
  }

  .vinyl-wrapper { position: relative; width: 120px; height: 120px; z-index: 2; }

  .vinyl {
    width: 120px; height: 120px;
    background: 
      radial-gradient(circle, transparent 35%, rgba(255,255,255,0.08) 36%, transparent 38%),
      radial-gradient(circle, #222 0%, #111 70%, #000 100%);
    border-radius: 50%;
    border: 1px solid #333;
    display: flex; align-items: center; justify-content: center;
    animation: spin 2.2s linear infinite;
    animation-play-state: paused;
  }
  .vinyl::before {
    content: ""; width: 40px; height: 40px;
    background: linear-gradient(135deg, #FFC064, var(--amber));
    border-radius: 50%; border: 2px solid #111;
  }
  .vinyl.playing { animation-play-state: running; }

  .tonearm {
    position: absolute; top: 6px; right: 24px;
    width: 45px; height: 105px;
    transform-origin: 22px 10px;
    transform: rotate(-35deg);
    transition: transform 0.8s ease;
    z-index: 10;
    pointer-events: none;
  }
  .tonearm-base { position: absolute; top: 0; left: 12px; width: 20px; height: 20px; background: #666; border-radius: 50%; }
  .tonearm-stick { position: absolute; top: 10px; left: 20px; width: 3px; height: 80px; background: #ddd; }
  .tonearm-cartridge { position: absolute; bottom: 10px; left: 14px; width: 10px; height: 18px; background: #FF9436; transform: rotate(20deg); }
  .tonearm.playing { transform: rotate(22deg); }

  @keyframes spin { 100% { transform: rotate(360deg); } }

  audio { width: 100%; filter: invert(0.9) hue-rotate(170deg); }

  /* FORM DI MODIFICA E SETTINGS */
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:4px;}
  .field input, .field textarea{
    width:100%; background:var(--night-2); border:1px solid var(--card-line);
    border-radius:6px; color:var(--ink); padding:8px 10px; font-family:'Special Elite', monospace; font-size:12px;
  }
  .field textarea{resize:vertical;min-height:55px;}
  .row-actions{display:flex;gap:10px;margin-top:14px;}
  .btn{
    flex:1; padding:10px; border-radius:999px; border:1px solid var(--card-line);
    background:none; color:var(--ink); font-size:11px; cursor:pointer; text-transform:uppercase;
  }
  .btn.primary{background:var(--amber); color:var(--amber-ink); border-color:var(--amber); font-weight:bold;}
  .btn.danger{color:#D97A82; border-color:rgba(217,122,130,0.4);}

  .settings-panel{
    background:var(--night-2); border:1px dashed var(--card-line); border-radius:10px; padding:14px; margin-bottom:20px;
  }
  .settings-title{font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--amber);margin-bottom:10px;}
  .settings-row{display:flex;gap:10px;}
  .settings-row .field{flex:1;}
</style>
</head>
<body>

<!-- SCHERMATA BENVENUTO -->
<div class="welcome-screen" id="welcomeScreen">
  <h1 class="welcome-title">Bentornata Anna</h1>
  <p class="welcome-sub">C'è un vinile che ti aspetta...</p>
  <button class="enter-btn" id="enterBtn">Sfoglia il Jukebox</button>
</div>

<div class="wrap">

  <header>
    <div class="eyebrow">una canzone al giorno</div>
    <h1 id="title">JUKEBOX</h1>
    <p class="subtitle" id="subtitle">finché non ci rivedremo</p>
    <button class="edit-toggle" id="editToggle" title="Modifica">✎</button>
  </header>

  <div class="tuner">
    <div class="tuner-line">
      <div class="tuner-ticks" id="ticks"></div>
    </div>
    <div class="tuner-label" id="tunerLabel">caricamento…</div>
  </div>

  <div id="settingsPanel" class="settings-panel" style="display:none;">
    <div class="settings-title">impostazioni calendario</div>
    <div class="field">
      <label>titolo</label>
      <input id="cfgTitle" type="text">
    </div>
    <div class="field">
      <label>sottotitolo</label>
      <input id="cfgSubtitle" type="text">
    </div>
    <div class="settings-row">
      <div class="field">
        <label>notte 1 =</label>
        <input id="cfgStart" type="date">
      </div>
      <div class="field">
        <label>numero di notti</label>
        <input id="cfgDays" type="number" min="1" max="31">
      </div>
    </div>
    <button class="btn primary" id="saveSettings" style="width:100%;">salva impostazioni</button>
  </div>

  <!-- RASTRELLIERA PORTAVINILI -->
  <div class="rack-container">
    <div id="grid" class="rack-grid"></div>
  </div>

</div>

<!-- VIEW MODAL (PLAYER) -->
<div class="overlay" id="viewOverlay">
  <div class="modal">
    <button class="close" id="closeView">✕</button>
    <div class="eyebrow" id="viewDayLabel">NOTTE 1</div>
    <div id="viewFilled">
      
      <div class="turntable">
        <div class="vinyl-wrapper">
          <div class="vinyl" id="vinylRecord"></div>
        </div>
        <div class="tonearm" id="tonearm">
          <div class="tonearm-base"></div>
          <div class="tonearm-stick"></div>
          <div class="tonearm-cartridge"></div>
        </div>
      </div>

      <h2 id="viewSong"></h2>
      <p class="artist" id="viewArtist"></p>
      <p class="message" id="viewMessage"></p>
      <audio id="audioPlayer" controls></audio>
    </div>
    <div id="viewEmpty" style="display:none;color:var(--ink-dim);font-size:13px;">
      questa notte non ha ancora una canzone. torna più tardi.
    </div>
  </div>
</div>

<!-- EDIT MODAL -->
<div class="overlay" id="editOverlay">
  <div class="modal">
    <button class="close" id="closeEdit">✕</button>
    <div class="eyebrow" id="editDayLabel">NOTTE 1</div>
    <div class="field">
      <label>titolo canzone</label>
      <input id="fSong" type="text" placeholder="es. Le biciclette">
    </div>
    <div class="field">
      <label>artista</label>
      <input id="fArtist" type="text" placeholder="es. Fulminacci">
    </div>
    <div class="field">
      <label>link audio / file mp3</label>
      <input id="fLink" type="text" placeholder="es. canzone1.mp3">
    </div>
    <div class="field">
      <label>messaggio</label>
      <textarea id="fMessage" placeholder="perché questa canzone"></textarea>
    </div>
    <div class="row-actions">
      <button class="btn danger" id="clearEntry">svuota</button>
      <button class="btn primary" id="saveEntry">salva</button>
    </div>
  </div>
</div>

<!-- CODE GATE -->
<div class="overlay" id="codeOverlay">
  <div class="modal" style="max-width:280px;text-align:center;">
    <button class="close" id="closeCode">✕</button>
    <div class="eyebrow">accesso modifica</div>
    <div class="field" style="margin-top:12px;">
      <input id="codeInput" type="password" placeholder="codice" autocomplete="off">
    </div>
    <div id="codeError" style="display:none;color:#D97A82;font-size:12px;margin-bottom:8px;">codice errato</div>
    <button class="btn primary" id="codeConfirm" style="width:100%;">sblocca</button>
  </div>
</div>

<script>
let data = null;
let editMode = false;
let activeDay = null;
let isEditor = false;
const EDIT_CODE = 'primopiano';

const $ = (id) => document.getElementById(id);

$('enterBtn').addEventListener('click', () => {
  $('welcomeScreen').classList.add('hidden');
});

function defaultData(){
  // Data odierna impostata come inizio così il Notte 1 è subito attivo!
  const todayStr = new Date().toISOString().slice(0,10);
  return {
    title: 'JUKEBOX',
    subtitle: 'finché non ci rivedremo',
    startDate: todayStr, 
    numDays: 10,              
    entries: {
      1: {
        songTitle: "Le biciclette",
        artist: "Fulminacci",
        link: "Fulminacci - Le biciclette [ARmBTwope68].mp3", 
        message: "Colpo basso"
      }
    }
  };
}

function todayISO(){
  const d = new Date();
  return new Date(d.getFullYear(), d.getMonth(), d.getDate()).toISOString().slice(0,10);
}

function addDays(iso, n){
  const d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0,10);
}

function dayState(dayIndex){
  const today = todayISO();
  const unlockDate = addDays(data.startDate, dayIndex - 1);
  const entry = data.entries[dayIndex];

  if (unlockDate > today) {
    return {locked:true, isToday:false, filled:false};
  }
  const isToday = unlockDate === today;
  return {locked:false, isToday, filled: !!(entry && entry.songTitle)};
}

function render(){
  $('title').textContent = data.title;
  $('subtitle').textContent = data.subtitle;
  $('cfgTitle').value = data.title;
  $('cfgSubtitle').value = data.subtitle;
  $('cfgStart').value = data.startDate;
  $('cfgDays').value = data.numDays;

  const ticks = $('ticks');
  ticks.innerHTML = '';
  for(let i=1;i<=data.numDays;i++){
    const s = dayState(i);
    const t = document.createElement('div');
    t.className = 'tick' + (s.isToday ? ' today' : (!s.locked ? ' past' : ''));
    ticks.appendChild(t);
  }
  $('tunerLabel').innerHTML = `notte <b>1</b> di ${data.numDays}`;

  const grid = $('grid');
  grid.innerHTML = '';
  for(let i=1;i<=data.numDays;i++){
    const s = dayState(i);
    const el = document.createElement('div');
    
    let cls = 'album-slot';
    if(s.locked) cls += ' locked';
    else if (s.isToday) cls += ' today-active';
    
    el.className = cls;
    
    let tag = 'NOTTE';
    if (s.isToday) tag = 'OGGI';
    else if (s.locked) tag = '🔒';

    el.innerHTML = `
      <div class="album-disc">
        <div class="album-disc-label">${String(i).padStart(2,'0')}</div>
      </div>
      <div class="album-sleeve">
        <div class="sleeve-num">${String(i).padStart(2,'0')}</div>
        <div class="sleeve-tag">${tag}</div>
      </div>
    `;
    
    el.addEventListener('click', () => {
      activeDay = i;
      if(isEditor && editMode) openEdit(i);
      else if(!s.locked) openView(i);
    });
    grid.appendChild(el);
  }
}

function openView(dayIndex){
  $('viewDayLabel').textContent = 'NOTTE ' + dayIndex;
  const entry = data.entries[dayIndex];
  const audio = $('audioPlayer');

  if(entry && entry.songTitle){
    $('viewFilled').style.display = 'block';
    $('viewEmpty').style.display = 'none';
    $('viewSong').textContent = entry.songTitle;
    $('viewArtist').textContent = entry.artist || '';
    $('viewMessage').textContent = entry.message || '';
    if(entry.link){
      audio.src = entry.link;
      audio.style.display = 'block';
    } else {
      audio.style.display = 'none';
    }
  } else {
    $('viewFilled').style.display = 'none';
    $('viewEmpty').style.display = 'block';
  }
  $('viewOverlay').classList.add('show');
}

$('audioPlayer').addEventListener('play', () => {
  $('vinylRecord').classList.add('playing');
  $('tonearm').classList.add('playing');
});
$('audioPlayer').addEventListener('pause', () => {
  $('vinylRecord').classList.remove('playing');
  $('tonearm').classList.remove('playing');
});

function closeViewModal(){
  $('viewOverlay').classList.remove('show');
  $('audioPlayer').pause();
}

$('closeView').addEventListener('click', closeViewModal);

function openEdit(dayIndex){
  $('editDayLabel').textContent = 'NOTTE ' + dayIndex;
  const entry = data.entries[dayIndex] || {};
  $('fSong').value = entry.songTitle || '';
  $('fArtist').value = entry.artist || '';
  $('fLink').value = entry.link || '';
  $('fMessage').value = entry.message || '';
  $('editOverlay').classList.add('show');
}

$('closeEdit').addEventListener('click', () => $('editOverlay').classList.remove('show'));

$('saveEntry').addEventListener('click', () => {
  data.entries[activeDay] = {
    songTitle: $('fSong').value.trim(),
    artist: $('fArtist').value.trim(),
    link: $('fLink').value.trim(),
    message: $('fMessage').value.trim()
  };
  render();
  $('editOverlay').classList.remove('show');
});

$('clearEntry').addEventListener('click', () => {
  delete data.entries[activeDay];
  render();
  $('editOverlay').classList.remove('show');
});

$('editToggle').addEventListener('click', () => {
  if(isEditor){
    editMode = !editMode;
    $('editToggle').classList.toggle('active', editMode);
    $('settingsPanel').style.display = editMode ? 'block' : 'none';
  } else {
    $('codeInput').value = '';
    $('codeError').style.display = 'none';
    $('codeOverlay').classList.add('show');
  }
});

$('closeCode').addEventListener('click', () => $('codeOverlay').classList.remove('show'));

$('codeConfirm').addEventListener('click', () => {
  if($('codeInput').value === EDIT_CODE){
    isEditor = true;
    editMode = true;
    $('codeOverlay').classList.remove('show');
    $('editToggle').classList.add('active');
    $('settingsPanel').style.display = 'block';
  } else {
    $('codeError').style.display = 'block';
  }
});

$('saveSettings').addEventListener('click', () => {
  data.title = $('cfgTitle').value.trim() || data.title;
  data.subtitle = $('cfgSubtitle').value.trim();
  data.startDate = $('cfgStart').value || data.startDate;
  data.numDays = Math.max(1, Math.min(31, parseInt($('cfgDays').value) || data.numDays));
  render();
});

data = defaultData();
render();
</script>
</body>
</html>
