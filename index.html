<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Notti lontane</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Special+Elite&display=swap');

  :root{
    --night-1:#06070E;
    --night-2:#101225;
    --night-3:#171A36;
    --card-line:#313663;
    --ink:#F8F4EA;
    --ink-dim:#8F8AA9;
    --amber:#FFB042;
    --amber-glow:rgba(255, 176, 66, 0.45);
    --amber-soft:rgba(255, 176, 66, 0.12);
    --amber-dim:#543D1F;
    --amber-ink:#1A1205;
    --radius:12px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 50% 0%, rgba(255, 176, 66, 0.18), transparent 50%),
      radial-gradient(ellipse at 80% 90%, rgba(27, 31, 66, 0.6), transparent 60%),
      linear-gradient(180deg, var(--night-1), var(--night-2) 60%, var(--night-1));
    color:var(--ink);
    font-family:'Special Elite', 'Courier New', monospace;
    display:flex;
    justify-content:center;
    padding:36px 16px 64px;
    position:relative;
  }
  body::before{
    content:"";
    position:fixed;inset:0;
    pointer-events:none;
    background-image:radial-gradient(circle at 1px 1px, rgba(243,237,223,0.04) 1px, transparent 0);
    background-size:6px 6px;
  }

  /* ---------- WELCOME SCREEN ---------- */
  .welcome-screen {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at center, var(--night-2), var(--night-1));
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    text-align: center;
    transition: opacity 0.8s ease, visibility 0.8s ease;
  }
  .welcome-screen.hidden {
    opacity: 0;
    visibility: hidden;
  }
  .welcome-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 64px;
    color: var(--amber);
    margin: 0 0 10px;
    letter-spacing: 0.08em;
    text-shadow: 0 0 25px var(--amber-glow);
    animation: floatTitle 4s ease-in-out infinite alternate;
  }
  @keyframes floatTitle {
    0% { transform: translateY(0px); }
    100% { transform: translateY(-8px); }
  }
  .welcome-sub {
    font-size: 16px;
    color: var(--ink-dim);
    font-style: italic;
    margin-bottom: 35px;
  }
  .enter-btn {
    padding: 16px 40px;
    border-radius: 999px;
    border: 2px solid var(--amber);
    background: linear-gradient(135deg, #FFC064, var(--amber));
    color: var(--amber-ink);
    font-family: 'Special Elite', monospace;
    font-size: 14px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 6px 25px var(--amber-glow);
    animation: pulseBtn 2.5s ease-in-out infinite;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  @keyframes pulseBtn {
    0%, 100% { transform: scale(1); box-shadow: 0 6px 25px var(--amber-glow); }
    50% { transform: scale(1.04); box-shadow: 0 10px 35px rgba(255, 176, 66, 0.7); }
  }
  .enter-btn:hover {
    transform: translateY(-3px) scale(1.06) !important;
  }

  .wrap{width:100%;max-width:560px;position:relative;}

  /* ---------- HEADER ---------- */
  header{text-align:center;margin-bottom:30px;position:relative;}
  .eyebrow{
    font-size:11px;
    letter-spacing:0.4em;
    text-transform:uppercase;
    color:var(--amber);
    margin-bottom:8px;
    text-shadow: 0 0 10px var(--amber-glow);
  }
  h1{
    font-family:'Bebas Neue', 'Arial Narrow', sans-serif;
    font-size:52px;
    font-weight:400;
    letter-spacing:0.08em;
    margin:0 0 4px;
    line-height:1;
    color: var(--ink);
    text-shadow: 0 4px 20px rgba(0,0,0,0.6);
  }
  .subtitle{
    color:var(--ink-dim);
    font-size:14px;
    font-style:italic;
    margin:0;
  }
  .edit-toggle{
    position:absolute;
    top:0; right:0;
    background:rgba(255,255,255,0.03);
    border:1px solid var(--card-line);
    color:var(--ink-dim);
    width:36px;height:36px;
    border-radius:50%;
    cursor:pointer;
    font-size:14px;
    display:flex;
    align-items:center;justify-content:center;
    opacity:0.7;
    transition:all .2s ease;
  }
  .edit-toggle:hover{opacity:1;border-color:var(--amber); color:var(--amber);}
  .edit-toggle.active{border-color:var(--amber);color:var(--amber);opacity:1;background:var(--amber-soft); box-shadow:0 0 12px var(--amber-glow);}

  /* ---------- TUNER ---------- */
  .tuner{margin:24px 0 32px;}
  .tuner-line{
    background:var(--night-1);
    border:1px solid var(--card-line);
    border-radius:8px;
    padding:10px 12px;
    box-shadow:inset 0 3px 8px rgba(0,0,0,0.6);
  }
  .tuner-ticks{
    display:flex;
    justify-content:space-between;
    gap:4px;
  }
  .tick{
    flex:1;
    height:14px;
    border-radius:3px;
    background:rgba(143, 138, 169, 0.12);
    transition: background 0.3s ease;
  }
  .tick.past{background:rgba(143, 138, 169, 0.4);}
  .tick.today{
    background:var(--amber);
    box-shadow:0 0 12px var(--amber-glow);
    animation:pulse 2s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:1;}
    50%{opacity:0.5;}
  }
  .tuner-label{
    text-align:center;
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--ink-dim);
    margin-top:12px;
  }
  .tuner-label b{color:var(--amber);font-weight:normal;}

  /* ---------- GRID PANNELLO ---------- */
  .grid-panel{
    background: linear-gradient(145deg, var(--night-3), #141730);
    border:1px solid var(--card-line);
    border-radius:16px;
    padding:20px;
    box-shadow:0 15px 35px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(5, 1fr);
    gap:14px;
  }
  @media (max-width:420px){
    .grid{grid-template-columns:repeat(4, 1fr);}
  }

  /* ---------- NUOVI TASSELLI A FORMA DI MINI VINILE ---------- */
  .track {
    aspect-ratio: 1;
    border-radius: var(--radius);
    position: relative;
    cursor: pointer;
    background: #121426;
    border: 1px solid var(--card-line);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  /* Il mini vinile all'interno della custodia */
  .track::before {
    content: "";
    position: absolute;
    right: -18%;
    top: 10%;
    width: 75%;
    height: 80%;
    border-radius: 50%;
    background: 
      radial-gradient(circle, #333 0%, #1a1a1a 40%, #000 100%),
      repeating-radial-gradient(circle, rgba(255,255,255,0.03) 0px, transparent 2px, rgba(255,255,255,0.03) 4px);
    border: 1px solid #333;
    box-shadow: -2px 0 6px rgba(0,0,0,0.6);
    transition: transform 0.3s ease;
    z-index: 1;
  }

  .track:hover {
    transform: translateY(-4px) scale(1.02);
    border-color: var(--amber);
    box-shadow: 0 8px 20px rgba(0,0,0,0.6);
  }

  .track:hover::before {
    transform: translateX(6px) rotate(15deg);
  }

  /* Testo del tassello */
  .track-content {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    width: 100%;
    height: 100%;
    padding: 8px 10px;
    background: linear-gradient(135deg, rgba(255,255,255,0.03) 0%, transparent 100%);
  }

  .track .num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    line-height: 1;
    color: var(--ink-dim);
  }

  .track .cap {
    font-size: 8px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-dim);
    opacity: 0.6;
    margin-top: 2px;
  }

  /* STATO 1: BLOCCATO (NOTTI FUTURE) */
  .track.locked {
    cursor: default;
    opacity: 0.3;
    background: #0b0c16;
    border-color: rgba(255,255,255,0.05);
  }
  .track.locked::before { display: none; }
  .track.locked:hover { transform: none; box-shadow: none; border-color: rgba(255,255,255,0.05); }

  /* STATO 2: GIÀ ASCOLTATE (PASSATE) */
  .track.past-filled {
    border-color: var(--card-line);
    background: linear-gradient(145deg, #1c203f, #111326);
  }
  .track.past-filled .num { color: #d0cce3; }
  .track.past-filled .cap { color: var(--amber); opacity: 0.9; }
  .track.past-filled::after {
    content: "✓";
    position: absolute;
    bottom: 6px;
    right: 8px;
    font-size: 10px;
    color: var(--amber);
    z-index: 2;
  }

  /* STATO 3: OGGI DA ASCOLTARE (DISPONIBILE) */
  .track.today-active {
    border: 2px solid var(--amber);
    background: linear-gradient(135deg, #2c2118, #181930);
    box-shadow: 0 0 15px var(--amber-glow);
    animation: glowTrack 2s infinite alternate;
  }
  @keyframes glowTrack {
    0% { box-shadow: 0 0 8px var(--amber-glow); }
    100% { box-shadow: 0 0 20px rgba(255, 176, 66, 0.7); }
  }
  .track.today-active .num { color: var(--amber); text-shadow: 0 0 8px var(--amber-glow); }
  .track.today-active .cap { color: var(--ink); opacity: 0.9; font-weight: bold; }
  
  /* Centro dell'etichetta del mini vinile attivo */
  .track.today-active::before {
    background: 
      radial-gradient(circle, var(--amber) 0%, var(--amber) 25%, #1a1a1a 26%, #000 100%);
  }

  /* ---------- MODAL & ANIMAZIONI ---------- */
  .overlay{
    position:fixed;inset:0;
    background:rgba(4,5,10,0.85);
    backdrop-filter:blur(8px);
    display:none;
    align-items:center;justify-content:center;
    padding:20px;
    z-index:50;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .overlay.show{
    display:flex;
    opacity: 1;
  }

  .modal{
    background: linear-gradient(160deg, var(--night-3), #121429);
    border:1px solid rgba(255,255,255,0.12);
    box-shadow:0 25px 50px rgba(0,0,0,0.8), 0 0 35px rgba(255, 176, 66, 0.1);
    border-radius:20px;
    padding:28px 24px 24px;
    width:100%;max-width:400px;
    position:relative;
    transform: translateY(20px) scale(0.92);
    transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .overlay.show .modal {
    transform: translateY(0) scale(1);
  }
  
  .modal .close{
    position:absolute;top:16px;right:16px;
    background:rgba(255,255,255,0.06);
    border:none;color:var(--ink-dim);
    width: 30px; height: 30px; border-radius: 50%;
    font-size:14px;cursor:pointer;
    display: flex; align-items: center; justify-content: center;
    transition:all .2s;
  }
  .modal .close:hover{color:var(--ink); background:rgba(255,255,255,0.2);}
  .modal .eyebrow{margin-bottom:4px;}
  .modal h2{
    font-family:'Bebas Neue', sans-serif;
    margin:0 0 2px;font-size:32px;font-weight:400;letter-spacing:0.04em;
    color:var(--amber);
    text-shadow: 0 0 15px var(--amber-glow);
  }
  .modal .artist{color:var(--ink-dim);font-style:italic;font-size:13px;margin:0 0 16px;}
  .modal .message{
    font-size:14px;line-height:1.7;
    color:var(--ink);
    margin:0 0 20px;
    white-space:pre-wrap;
    border-top:1px dashed var(--card-line);
    border-bottom:1px dashed var(--card-line);
    padding:16px 0;
  }
  
  /* ---------- GIRADISCHI SCOCCA IN LEGNO ---------- */
  .turntable {
    position: relative;
    width: 245px;
    height: 160px;
    margin: 10px auto 22px;
    background: 
      repeating-linear-gradient(90deg, rgba(0,0,0,0.08) 0px, rgba(0,0,0,0.08) 2px, transparent 2px, transparent 4px),
      linear-gradient(135deg, #3b2219 0%, #26140e 50%, #1f100a 100%);
    border-radius: 14px;
    border: 3px solid #140a06;
    box-shadow: 
      inset 0 0 12px rgba(0,0,0,0.9), 
      0 12px 25px rgba(0,0,0,0.7),
      inset 0 1px 0 rgba(255,255,255,0.15);
    display: flex;
    align-items: center;
    padding-left: 18px;
    overflow: hidden;
  }

  .turntable::before {
    content: "";
    position: absolute;
    left: 12px;
    width: 138px;
    height: 138px;
    border-radius: 50%;
    background: radial-gradient(circle, #666 0%, #222 70%, #111 100%);
    box-shadow: 0 0 10px rgba(0,0,0,0.8);
    border: 1px solid #444;
  }

  .vinyl-wrapper {
    position: relative;
    width: 126px;
    height: 126px;
    z-index: 2;
  }

  .vinyl {
    width: 126px;
    height: 126px;
    background: 
      radial-gradient(circle, transparent 35%, rgba(255,255,255,0.05) 36%, transparent 38%, rgba(255,255,255,0.05) 50%, transparent 52%),
      linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.12) 50%, transparent 60%),
      radial-gradient(circle, #252525 0%, #111 70%, #050505 100%);
    border-radius: 50%;
    border: 2px solid #1a1a1a;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 15px rgba(0,0,0,0.8);
    animation: spin 2.2s linear infinite;
    animation-play-state: paused;
  }

  .vinyl::before {
    content: "";
    width: 42px;
    height: 42px;
    background: radial-gradient(circle, #FFC064, var(--amber));
    border-radius: 50%;
    border: 3px solid #111;
    box-shadow: inset 0 0 4px rgba(0,0,0,0.6);
  }

  .vinyl::after {
    content: "";
    position: absolute;
    width: 8px;
    height: 8px;
    background: #181b36;
    border-radius: 50%;
    box-shadow: 0 0 2px rgba(255,255,255,0.5);
  }

  .vinyl.playing {
    animation-play-state: running;
  }

  /* BRACCIO METALLICO */
  .tonearm {
    position: absolute;
    top: 8px;
    right: 28px;
    width: 50px;
    height: 110px;
    pointer-events: none;
    transform-origin: 25px 12px;
    transform: rotate(-32deg);
    transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 10;
  }

  .tonearm-base {
    position: absolute;
    top: 2px;
    left: 15px;
    width: 22px;
    height: 22px;
    background: linear-gradient(135deg, #999cb3, #3B3E5C);
    border-radius: 50%;
    border: 2px solid #111;
    box-shadow: 0 3px 6px rgba(0,0,0,0.6);
  }

  .tonearm-stick {
    position: absolute;
    top: 12px;
    left: 24px;
    width: 4px;
    height: 85px;
    background: linear-gradient(90deg, #ddd, #fff, #888);
    border-radius: 2px;
    box-shadow: 2px 2px 4px rgba(0,0,0,0.4);
  }

  .tonearm-cartridge {
    position: absolute;
    bottom: 12px;
    left: 16px;
    width: 12px;
    height: 20px;
    background: linear-gradient(135deg, #FF9436, #D97A3E);
    border-radius: 2px;
    transform: rotate(38deg);
    box-shadow: 0 3px 6px rgba(0,0,0,0.6);
  }

  .tonearm.playing {
    transform: rotate(38deg);
  }

  @keyframes spin {
    100% { transform: rotate(360deg); }
  }

  audio {
    width: 100%;
    height: 40px;
    border-radius: 999px;
    outline: none;
    filter: invert(0.9) hue-rotate(170deg);
  }

  .empty-state{color:var(--ink-dim);font-size:13px;line-height:1.7;}

  /* ---------- EDIT FORM ---------- */
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:10px;letter-spacing:0.12em;text-transform:uppercase;
    color:var(--ink-dim);margin-bottom:6px;
  }
  .field input, .field textarea{
    width:100%;
    background:var(--night-2);
    border:1px solid var(--card-line);
    border-radius:8px;
    color:var(--ink);
    padding:10px 12px;
    font-family:'Special Elite', monospace;
    font-size:13px;
    transition: border-color 0.2s ease;
  }
  .field textarea{resize:vertical;min-height:65px;}
  .field input:focus, .field textarea:focus{outline:none; border-color:var(--amber); box-shadow:0 0 8px var(--amber-glow);}
  .row-actions{display:flex;gap:10px;margin-top:18px;}
  .btn{
    flex:1;
    padding:12px;border-radius:999px;border:2px solid var(--card-line);
    background:none;color:var(--ink);
    font-size:11px;letter-spacing:0.08em;text-transform:uppercase;cursor:pointer;
    transition:all .2s ease;
  }
  .btn.primary{background:var(--amber);color:var(--amber-ink);border-color:var(--amber);font-weight:700; box-shadow:0 4px 15px var(--amber-glow);}
  .btn.primary:hover{background:#FFB956; transform:translateY(-1px);}
  .btn.danger{color:#D97A82;border-color:rgba(217,122,130,0.4);}
  .btn.danger:hover{background:rgba(217,122,130,0.12);}

  .settings-panel{
    background:var(--night-2);
    border:1px dashed var(--card-line);
    border-radius:12px;
    padding:18px;
    margin-bottom:24px;
  }
  .settings-panel .settings-title{
    font-size:10px;letter-spacing:0.12em;
    text-transform:uppercase;color:var(--amber);margin-bottom:12px;
  }
  .settings-row{display:flex;gap:10px;}
  .settings-row .field{flex:1;}

  .status{
    text-align:center;color:var(--ink-dim);font-size:12px;padding:40px 0;
  }
</style>
</head>
<body>

<!-- SCHERMATA INTRODUTTIVA -->
<div class="welcome-screen" id="welcomeScreen">
  <h1 class="welcome-title">Bentornata Anna</h1>
  <p class="welcome-sub">buon ascolto</p>
  <button class="enter-btn" id="enterBtn">Apri il Jukebox</button>
</div>

<div class="wrap">

  <header>
    <div class="eyebrow">questo è il</div>
    <h1 id="title">JUKEBOX</h1>
    <p class="subtitle" id="subtitle">fino all'ultimo giorno</p>
    <button class="edit-toggle" id="editToggle" title="Modifica">✎</button>
  </header>

  <div class="tuner">
    <div class="tuner-line">
      <div class="tuner-ticks" id="ticks"></div>
    </div>
    <div class="tuner-label" id="tunerLabel">caricamento…</div>
  </div>

  <div id="settingsPanel" class="settings-panel" style="display:none;">
    <div class="settings-title">impostazioni calendario</div>
    <div class="field">
      <label>titolo</label>
      <input id="cfgTitle" type="text">
    </div>
    <div class="field">
      <label>sottotitolo</label>
      <input id="cfgSubtitle" type="text">
    </div>
    <div class="settings-row">
      <div class="field">
        <label>notte 1 =</label>
        <input id="cfgStart" type="date">
      </div>
      <div class="field">
        <label>numero di notti</label>
        <input id="cfgDays" type="number" min="1" max="31">
      </div>
    </div>
    <button class="btn primary" id="saveSettings" style="width:100%;">salva impostazioni</button>
  </div>

  <div class="grid-panel">
    <div id="grid" class="grid"></div>
  </div>

  <div class="status" id="status" style="display:none;"></div>

</div>

<!-- view modal -->
<div class="overlay" id="viewOverlay">
  <div class="modal">
    <button class="close" id="closeView">✕</button>
    <div class="eyebrow" id="viewDayLabel">NOTTE 1</div>
    <div id="viewFilled">
      
      <div class="turntable">
        <div class="vinyl-wrapper">
          <div class="vinyl" id="vinylRecord"></div>
        </div>
        <div class="tonearm" id="tonearm">
          <div class="tonearm-base"></div>
          <div class="tonearm-stick"></div>
          <div class="tonearm-cartridge"></div>
        </div>
      </div>

      <h2 id="viewSong"></h2>
      <p class="artist" id="viewArtist"></p>
      <p class="message" id="viewMessage"></p>
      <audio id="audioPlayer" controls></audio>
    </div>
    <div id="viewEmpty" class="empty-state" style="display:none;">
      questa notte non ha ancora una canzone. torna più tardi.
    </div>
  </div>
</div>

<!-- edit modal -->
<div class="overlay" id="editOverlay">
  <div class="modal">
    <button class="close" id="closeEdit">✕</button>
    <div class="eyebrow" id="editDayLabel">NOTTE 1</div>
    <div class="field">
      <label>titolo canzone</label>
      <input id="fSong" type="text" placeholder="es. Nights">
    </div>
    <div class="field">
      <label>artista</label>
      <input id="fArtist" type="text" placeholder="es. Frank Ocean">
    </div>
    <div class="field">
      <label>link audio / file mp3</label>
      <input id="fLink" type="text" placeholder="es. audio/canzone1.mp3">
    </div>
    <div class="field">
      <label>messaggio</label>
      <textarea id="fMessage" placeholder="perché questa canzone, oggi"></textarea>
    </div>
    <div class="row-actions">
      <button class="btn danger" id="clearEntry">svuota</button>
      <button class="btn primary" id="saveEntry">salva</button>
    </div>
  </div>
</div>

<!-- code gate -->
<div class="overlay" id="codeOverlay">
  <div class="modal" style="max-width:290px;text-align:center;">
    <button class="close" id="closeCode">✕</button>
    <div class="eyebrow">accesso proiezionista</div>
    <div class="field" style="margin-top:14px;">
      <input id="codeInput" type="password" placeholder="codice" autocomplete="off">
    </div>
    <div id="codeError" style="display:none;color:#D97A82;font-size:12px;margin-bottom:10px;">codice sbagliato</div>
    <button class="btn primary" id="codeConfirm" style="width:100%;">sblocca</button>
  </div>
</div>

<script>
let data = null;
let editMode = false;
let activeDay = null;

const $ = (id) => document.getElementById(id);
let isEditor = false;
const EDIT_CODE = 'primopiano';

$('enterBtn').addEventListener('click', () => {
  $('welcomeScreen').classList.add('hidden');
});

function todayISO(){
  const d = new Date();
  return new Date(d.getFullYear(), d.getMonth(), d.getDate()).toISOString().slice(0,10);
}

function addDays(iso, n){
  const d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0,10);
}

function defaultData(){
  return {
    title: 'JUKEBOX',
    subtitle: 'finché non ci rivedremo',
    startDate: '2026-07-30', 
    numDays: 10,              
    entries: {
      1: {
        songTitle: ".01",
        artist: "Unknown artist",
        link: "Fulminacci - Le biciclette [ARmBTwope68].mp3", 
        message: "Colpo basso"
      },
      2: {
        songTitle: "Titolo Canzone 2",
        artist: "Artista 2",
        link: "audio/canzone2.mp3",
        message: "Messaggio per la seconda notte."
      },
      3: {
        songTitle: "Titolo Canzone 3",
        artist: "Artista 3",
        link: "audio/canzone3.mp3",
        message: "Messaggio per la terza notte."
      },
      4: {
        songTitle: "Titolo Canzone 4",
        artist: "Artista 4",
        link: "audio/canzone4.mp3",
        message: "Messaggio per la quarta notte."
      },
      5: {
        songTitle: "Titolo Canzone 5",
        artist: "Artista 5",
        link: "audio/canzone5.mp3",
        message: "Messaggio per la quinta notte."
      },
      6: {
        songTitle: "Titolo Canzone 6",
        artist: "Artista 6",
        link: "audio/canzone6.mp3",
        message: "Messaggio per la sesta notte."
      },
      7: {
        songTitle: "Titolo Canzone 7",
        artist: "Artista 7",
        link: "audio/canzone7.mp3",
        message: "Messaggio per la settima notte."
      },
      8: {
        songTitle: "Titolo Canzone 8",
        artist: "Artista 8",
        link: "audio/canzone8.mp3",
        message: "Messaggio per l'ottava notte."
      },
      9: {
        songTitle: "Titolo Canzone 9",
        artist: "Artista 9",
        link: "audio/canzone9.mp3",
        message: "Messaggio per la nona notte."
      },
      10: {
        songTitle: "Titolo Canzone 10",
        artist: "Artista 10",
        link: "audio/canzone10.mp3",
        message: "Messaggio per la decima notte."
      }
    }
  };
}

async function load(){
  data = defaultData();
  render();
}

async function save(){
  // Sincronizzazione via GitHub o LocalStorage
}

function dayUnlockDate(dayIndex){
  return addDays(data.startDate, dayIndex - 1);
}

function dayState(dayIndex){
  const today = todayISO();
  const unlockDate = dayUnlockDate(dayIndex);
  const entry = data.entries[dayIndex];

  if (unlockDate > today) {
    return {locked:true, isToday:false, filled:false, unlockDate};
  }

  const isToday = unlockDate === today;
  return {locked:false, isToday, filled: !!(entry && entry.songTitle), unlockDate};
}

function render(){
  $('title').textContent = data.title;
  $('subtitle').textContent = data.subtitle;
  $('cfgTitle').value = data.title;
  $('cfgSubtitle').value = data.subtitle;
  $('cfgStart').value = data.startDate;
  $('cfgDays').value = data.numDays;

  const ticks = $('ticks');
  ticks.innerHTML = '';
  const today = todayISO();
  let unlockedCount = 0;
  for(let i=1;i<=data.numDays;i++){
    const s = dayState(i);
    if(!s.locked) unlockedCount++;
    const t = document.createElement('div');
    t.className = 'tick' + (s.isToday ? ' today' : (!s.locked ? ' past' : ''));
    ticks.appendChild(t);
  }
  const label = $('tunerLabel');
  if(unlockedCount === 0){
    label.innerHTML = `si parte tra <b>${Math.max(0, Math.ceil((new Date(data.startDate)-new Date(today))/86400000))}</b> giorni`;
  } else if(unlockedCount >= data.numDays){
    label.innerHTML = `tutte le <b>${data.numDays}</b> notti sono sbloccate`;
  } else {
    label.innerHTML = `notte <b>${unlockedCount}</b> di ${data.numDays}`;
  }

  const grid = $('grid');
  grid.innerHTML = '';
  for(let i=1;i<=data.numDays;i++){
    const s = dayState(i);
    const el = document.createElement('div');
    
    // Classi differenziate per lo stato dei mini-vinili
    let cls = 'track';
    if(s.locked) {
      cls += ' locked';
    } else if (s.isToday) {
      cls += ' today-active';
    } else {
      cls += ' past-filled';
    }
    
    el.className = cls;
    
    let subText = 'NOTTE';
    if (s.isToday) subText = 'OGGI';
    else if (s.locked) subText = '🔒';

    el.innerHTML = `
      <div class="track-content">
        <div class="num">${String(i).padStart(2,'0')}</div>
        <div class="cap">${subText}</div>
      </div>
    `;
    
    el.addEventListener('click', () => onTrackClick(i, s));
    grid.appendChild(el);
  }
}

function onTrackClick(dayIndex, state){
  activeDay = dayIndex;
  if(isEditor && editMode){
    openEdit(dayIndex);
    return;
  }
  if(state.locked) return;
  openView(dayIndex, state);
}

function openView(dayIndex, state){
  $('viewDayLabel').textContent = 'NOTTE ' + dayIndex;
  const entry = data.entries[dayIndex];
  const audio = $('audioPlayer');
  const vinyl = $('vinylRecord');
  const tonearm = $('tonearm');

  if(entry && entry.songTitle){
    $('viewFilled').style.display = 'block';
    $('viewEmpty').style.display = 'none';
    $('viewSong').textContent = entry.songTitle;
    $('viewArtist').textContent = entry.artist || '';
    $('viewMessage').textContent = entry.message || '';
    
    if(entry.link){
      audio.src = entry.link;
      audio.style.display = 'block';
    } else {
      audio.removeAttribute('src');
      audio.style.display = 'none';
    }
    vinyl.classList.remove('playing');
    tonearm.classList.remove('playing');
    audio.pause();
  } else {
    $('viewFilled').style.display = 'none';
    $('viewEmpty').style.display = 'block';
    audio.pause();
  }
  $('viewOverlay').classList.add('show');
}

$('audioPlayer').addEventListener('play', () => {
  $('vinylRecord').classList.add('playing');
  $('tonearm').classList.add('playing');
});
$('audioPlayer').addEventListener('pause', () => {
  $('vinylRecord').classList.remove('playing');
  $('tonearm').classList.remove('playing');
});
$('audioPlayer').addEventListener('ended', () => {
  $('vinylRecord').classList.remove('playing');
  $('tonearm').classList.remove('playing');
});

function closeViewModal(){
  $('viewOverlay').classList.remove('show');
  $('audioPlayer').pause();
  $('vinylRecord').classList.remove('playing');
  $('tonearm').classList.remove('playing');
}

$('closeView').addEventListener('click', closeViewModal);
$('viewOverlay').addEventListener('click', (e) => { 
  if(e.target === $('viewOverlay')) closeViewModal(); 
});

function openEdit(dayIndex){
  $('editDayLabel').textContent = 'NOTTE ' + dayIndex;
  const entry = data.entries[dayIndex] || {};
  $('fSong').value = entry.songTitle || '';
  $('fArtist').value = entry.artist || '';
  $('fLink').value = entry.link || '';
  $('fMessage').value = entry.message || '';
  $('editOverlay').classList.add('show');
}

$('closeEdit').addEventListener('click', () => $('editOverlay').classList.remove('show'));
$('editOverlay').addEventListener('click', (e) => { if(e.target === $('editOverlay')) $('editOverlay').classList.remove('show'); });

$('saveEntry').addEventListener('click', async () => {
  const songTitle = $('fSong').value.trim();
  data.entries[activeDay] = {
    songTitle,
    artist: $('fArtist').value.trim(),
    link: $('fLink').value.trim(),
    message: $('fMessage').value.trim()
  };
  await save();
  render();
  $('editOverlay').classList.remove('show');
});

$('clearEntry').addEventListener('click', async () => {
  delete data.entries[activeDay];
  await save();
  render();
  $('editOverlay').classList.remove('show');
});

$('editToggle').addEventListener('click', () => {
  if(isEditor){
    editMode = !editMode;
    $('editToggle').classList.toggle('active', editMode);
    $('settingsPanel').style.display = editMode ? 'block' : 'none';
  } else {
    $('codeInput').value = '';
    $('codeError').style.display = 'none';
    $('codeOverlay').classList.add('show');
  }
});

$('closeCode').addEventListener('click', () => $('codeOverlay').classList.remove('show'));
$('codeOverlay').addEventListener('click', (e) => { if(e.target === $('codeOverlay')) $('codeOverlay').classList.remove('show'); });

function tryUnlock(){
  if($('codeInput').value === EDIT_CODE){
    isEditor = true;
    editMode = true;
    $('codeOverlay').classList.remove('show');
    $('editToggle').classList.add('active');
    $('settingsPanel').style.display = 'block';
  } else {
    $('codeError').style.display = 'block';
    $('codeInput').value = '';
  }
}
$('codeConfirm').addEventListener('click', tryUnlock);
$('codeInput').addEventListener('keydown', (e) => { if(e.key === 'Enter') tryUnlock(); });

$('saveSettings').addEventListener('click', async () => {
  data.title = $('cfgTitle').value.trim() || data.title;
  data.subtitle = $('cfgSubtitle').value.trim();
  data.startDate = $('cfgStart').value || data.startDate;
  data.numDays = Math.max(1, Math.min(31, parseInt($('cfgDays').value) || data.numDays));
  await save();
  render();
});

load();
</script>
</body>
</html>
